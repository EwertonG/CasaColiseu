name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coliseu
          POSTGRES_PASSWORD: coliseu
          POSTGRES_DB: casacoliseu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U coliseu -d casacoliseu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coliseu:coliseu@localhost:5433/casacoliseu
      JWT_SECRET: segredo-do-ci-com-mais-de-trinta-e-dois-caracteres

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test
